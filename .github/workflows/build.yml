name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pywebview pyinstaller

      - name: Build Fretwork.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Fretwork --add-data "fretwork.html;." fretwork_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: Fretwork
          path: dist/Fretwork.exe

      - name: Publish as the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Fretwork.exe \
            --title "Fretwork (latest build)" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download Fretwork.exe and double-click it."
