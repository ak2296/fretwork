<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretwork Guitar Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* MODE operate: a practice tool used at home, guitar in lap, glanced at from about a metre, often in the evening
   WORLD the rock and metal stage: amp-panel lettering, warm black, tube-glow red-orange; the world lends type, palette, density and one move
   SIGNATURE the tempo ladder: an amp-meter bar under the readout showing start, now, goal and best clean run
   COLOUR dark stage by default (use scene), light theme supported; accent = live note, primary action, progress; green = clean
   TYPE Bebas Neue for display and the tempo readout, Source Sans 3 for everything read
   LAYOUT app bar with primary nav; library left, player right; phone: player first, library below */
:root{color-scheme:dark;
 --bg:light-dark(#f4f1ec,#0e0d0c);--surface:light-dark(#ffffff,#171514);--raised:light-dark(#f8f5f1,#201d1b);--line:light-dark(#d9d0c6,#35302c);
 --ink:light-dark(#17130f,#f3efe9);--mut:light-dark(#5c5249,#b9b0a6);--acc:light-dark(#c9361a,#ff4b2b);--on-acc:light-dark(#ffffff,#1a0702);
 --acc-soft:light-dark(#fbe4dd,#2c1612);--ok:light-dark(#17784a,#3ddc8c);--ok-soft:light-dark(#dcf3e7,#10261b);--amber:light-dark(#9a5b00,#ffb547);
 --stage:#14110f;--r:12px;--shadow:0 1px 2px rgb(0 0 0/.18),0 8px 24px -12px rgb(0 0 0/.45)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme]){color-scheme:light}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif;overflow-x:clip;caret-color:var(--acc);-webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:var(--on-acc)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
h1,h2,h3{font-family:"Bebas Neue","Source Sans 3",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
/* app bar */
.bar-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:10px max(16px,2.5vw);background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.skip{position:absolute;left:12px;top:-60px;z-index:10;background:var(--acc);color:var(--on-acc);padding:12px 16px;border-radius:10px;font-weight:600;text-decoration:none}.skip:focus{top:10px}
.brand{margin:0;display:flex;align-items:center;gap:10px;font:400 30px/1 "Bebas Neue",sans-serif;letter-spacing:.04em;white-space:nowrap}
.brand svg{width:28px;height:28px;color:var(--acc)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav button{background:none;border:0;border-radius:8px;min-height:44px;padding:0 14px;font:600 16px "Source Sans 3",sans-serif;color:var(--mut);white-space:nowrap}
.nav button:hover{color:var(--ink);background:var(--raised)}
.nav button[aria-selected=true]{color:var(--ink);background:var(--raised);box-shadow:inset 0 -2px 0 var(--acc)}
.today{color:var(--mut);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}.today b{color:var(--ink);font-weight:600}
/* shell */
.shell{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:0;min-height:calc(100dvh - 65px)}
.library{border-right:1px solid var(--line);background:var(--surface);padding:18px max(16px,1.5vw) 40px;overflow:auto;max-height:calc(100dvh - 65px);position:sticky;top:65px}
.player{padding:18px max(16px,2.5vw) 48px;display:grid;gap:14px;align-content:start}
@media(min-width:1000px){.library{grid-column:1;grid-row:1}.player{grid-column:2;grid-row:1}}
@media(max-width:999px){.shell{grid-template-columns:minmax(0,1fr)}.library{order:2;position:static;max-height:none;border-right:0;border-top:1px solid var(--line)}.today{display:none}}
/* now playing */
.head{display:grid;gap:6px}
.head h2{font-size:clamp(32px,3.6vw,44px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:15px}
.meta span{white-space:nowrap}
#itip{margin:2px 0 0;max-width:72ch;color:var(--ink);opacity:.86}
.stage{background:var(--stage);color:#f1e9dc;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #2a2420}
.stage-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0;color:#a8998a;font-size:14px}
.light{width:14px;height:14px;border-radius:50%;background:var(--acc);opacity:.15;box-shadow:0 0 0 3px #ffffff0d}
.fig{position:relative}.fig>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.run{height:236px}.fb{height:128px;border-top:1px solid #ffffff12}
#run text,#fb text{font-family:"Source Sans 3",sans-serif}
#run .st.now circle{fill:#ff4b2b}#run .st.now text.f{fill:#1a0702}#run .st.now .strum{stroke:#ff4b2b;opacity:1}#run .st.now text.pk{fill:#ff4b2b}
/* transport */
.transport{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
button,a,summary,[role=button],input,select{touch-action:manipulation}
button{font:600 16px/1 "Source Sans 3",sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--mut)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.primary:hover{border-color:var(--ink)}
.play{min-width:140px;min-height:56px;font-size:19px;border-radius:14px}
.play.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tempo{display:grid;grid-template-columns:auto auto auto;align-items:center;gap:10px}
.readout{display:flex;align-items:baseline;gap:6px}
.readout output{font:400 64px/.9 "Bebas Neue",sans-serif;font-variant-numeric:tabular-nums;min-width:2.1ch;text-align:right}
.readout span{color:var(--mut);font-size:15px}
.tempo button{width:44px;padding:0}
.tempo-wide{flex:1;min-width:240px;display:grid;gap:8px}
input[type=range]{width:100%;accent-color:var(--acc);height:28px;margin:0}
.ladder{position:relative;height:12px;border-radius:6px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.ladder .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,color-mix(in oklab,var(--acc) 55%,transparent),var(--acc));border-radius:6px;transition:width .3s cubic-bezier(.2,.8,.2,1)}
.ladder .ticks{position:absolute;inset:0;background-image:linear-gradient(90deg,transparent calc(100% - 1px),color-mix(in oklab,var(--ink) 35%,transparent) 0);opacity:.5}
.ladder .best{position:absolute;top:-1px;bottom:-1px;width:3px;margin-left:-1px;background:var(--ok);display:none}
.ladder-lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.ladder-lab b{color:var(--ok);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;white-space:nowrap;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.35);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.switch input:checked{background:var(--acc)}.switch input:checked::before{transform:translateX(16px)}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:12px;background:var(--raised);border:1px solid var(--line)}
.group label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
input[type=number],input[type=text],select,textarea{font:16px "Source Sans 3",sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
input[type=number]{width:4.8em;font-variant-numeric:tabular-nums}
select{padding-right:28px}
.warn{color:var(--acc);border-color:var(--acc)}
.ok-btn{color:var(--ok);border-color:color-mix(in oklab,var(--ok) 50%,var(--line));background:var(--ok-soft)}
#status{color:var(--mut);font-size:15px;flex-basis:100%}
.divider{height:1px;background:var(--line);margin:2px 0}
/* library */
.library h3{font-size:26px;margin:22px 0 10px}
.library h3:first-child{margin-top:0}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;text-align:left;transition:background .12s,border-color .12s}
.item:hover{background:var(--raised)}
.item.sel{border-color:var(--acc);background:var(--acc-soft)}
.item b{font-weight:600;line-height:1.3}.item small{color:var(--mut);font-size:14px;grid-column:1}
.item .best{grid-row:1/3;grid-column:2;font:400 26px/1 "Bebas Neue",sans-serif;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .best i{display:block;font:500 13px "Source Sans 3",sans-serif;color:var(--mut);font-style:normal}
.item .best.done{color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;grid-column:1/-1}.acts button,.acts a{min-height:44px;padding:0 12px;font-size:15px}
.acts a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.lvl{border-bottom:1px solid var(--line);padding:4px 0}
.lvl summary{list-style:none;display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 12px;align-items:center;min-height:56px;cursor:pointer;padding:6px 4px;border-radius:8px}
.lvl summary::-webkit-details-marker{display:none}
.lvl summary:hover{background:var(--raised)}
.lvl .num{font:400 34px/1 "Bebas Neue",sans-serif;color:var(--acc);text-align:center}
.lvl .nm{font-weight:600;line-height:1.25}
.lvl .cnt{font-size:14px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl .pbar{grid-column:2/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.lvl .pbar i{display:block;height:100%;background:var(--ok)}
.lvl[open] summary{margin-bottom:4px}
.lvl .hint{margin:0 4px 10px}
.form{display:grid;gap:12px}.form label.switch{display:inline-flex;font-weight:500;font-size:16px}.form label:not(.switch){display:grid;gap:4px;white-space:normal;font-weight:600;font-size:15px}
.form .two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.form .two input,.form .two select,.form select{width:100%}
textarea{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:14px;min-height:200px;white-space:pre;overflow-x:auto;resize:vertical;line-height:1.35}
.hint{color:var(--mut);font-size:15px;margin:0;line-height:1.45}
.err{color:var(--acc);font-size:15px;margin:0;font-weight:600}
.err:empty,.hint:empty{display:none}
.big{font:400 56px/1 "Bebas Neue",sans-serif}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:6.5em minmax(0,1fr) 4.4em;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:14px;color:var(--mut)}
.flabel{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
.srch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.srch input{width:100%}
.sres{display:grid;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.sres li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raised)}
.sres small{color:var(--mut);font-size:14px}
.steps{padding-left:20px;margin:0;color:var(--mut);font-size:15px}.steps li{margin:4px 0}
.loading::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.run{height:230px}.fb{height:120px}.readout output{font-size:54px}.play{flex:1}.form .two{grid-template-columns:repeat(2,minmax(0,1fr))}.brand span{display:none}.bar-top{gap:8px}}
@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
</style>
</head>

<a class="skip" href="#main">Skip to the player</a>
<header class="bar-top">
  <h1 class="brand"><svg aria-hidden="true"><use href="#i-logo"/></svg><span>Fretwork</span></h1>
  <nav class="nav" role="tablist" aria-label="Library">
    <button role="tab" id="t-drills" aria-selected="true">Lessons</button>
    <button role="tab" id="t-scales" aria-selected="false">Scales</button>
    <button role="tab" id="t-songs" aria-selected="false">My songs</button>
    <button role="tab" id="t-prog" aria-selected="false">Progress</button>
  </nav>
  <div class="today" id="today"></div>
</header>

<div class="shell">
<main class="player" id="main" tabindex="-1">
  <div class="head">
    <h2 id="iname">Chromatic 1-2-3-4</h2>
    <div class="meta" id="imeta"></div>
    <p id="itip"></p>
  </div>
  <div class="stage">
    <div class="stage-top"><span>Tab · pick directions below · fretboard shows now and next</span><span class="light" id="light" title="Beat" aria-hidden="true"></span></div>
    <div class="fig run"><svg id="run" role="img" aria-label="Scrolling tab of the current exercise"></svg></div>
    <div class="fig fb"><svg id="fb" role="img" aria-label="Fretboard showing where your fingers go now and next"></svg></div>
  </div>
  <section class="transport" aria-label="Practice controls">
    <div class="row">
      <button id="play" class="primary play"><svg aria-hidden="true" class="ic fill"><use href="#i-play"/></svg><span>Play</span></button>
      <div class="tempo">
        <button id="minus" aria-label="2 bpm slower"><svg aria-hidden="true" class="ic"><use href="#i-minus"/></svg></button>
        <div class="readout"><output id="bpmv" aria-live="polite">60</output><span>bpm</span></div>
        <button id="plus" aria-label="2 bpm faster"><svg aria-hidden="true" class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <div class="tempo-wide">
        <input type="range" id="bpm" min="30" max="260" value="60" aria-label="Tempo">
        <div class="ladder" id="ladder" aria-hidden="true"><i class="fill" id="lfill"></i><i class="ticks" id="lticks"></i><i class="best" id="lbest"></i></div>
        <div class="ladder-lab"><span id="lstart">Start 60</span><span id="lbestlab"></span><span id="lgoal">Goal 120</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="cin" checked> Count-in</label>
      <label class="switch"><input type="checkbox" id="clk" checked> Click</label>
      <label class="switch"><input type="checkbox" id="snd" checked> Guide notes</label>
    </div>
    <div class="group">
      <label class="switch"><input type="checkbox" id="auto" checked> Auto speed-up</label>
      <label>to <input type="number" inputmode="numeric" id="tgt" min="30" max="260" value="120"> bpm</label>
      <label>by +<input type="number" inputmode="numeric" id="inc" min="1" max="20" value="4"></label>
      <label>every <input type="number" inputmode="numeric" id="every" min="1" max="20" value="2"> loops</label>
    </div>
    <div class="row judge">
      <button id="clean" class="ok-btn"><svg aria-hidden="true" class="ic"><use href="#i-check"/></svg>Clean run, log it</button>
      <button id="messy"><svg aria-hidden="true" class="ic"><use href="#i-slower"/></svg>Too messy, slow down</button>
      <button id="next"><svg aria-hidden="true" class="ic"><use href="#i-next"/></svg>Next exercise</button>
      <span id="status" role="status" aria-live="polite">Space bar starts and stops.</span>
    </div>
  </section>
</main>

<script>
{
const $=s=>document.querySelector(s);
const OPEN=[329.63,246.94,196,146.83,110,82.41];
const SN=['e','B','G','D','A','E'];

function chordKey(c){c=c.replace(/\/.*$/,'');if(SHAPES[c])return c;const m=c.match(/^([A-G][#b]?)(.*)$/);if(!m)return null;const roots=[m[1],ENH[m[1]]].filter(Boolean);
 const q=[m[2],m[2].replace('maj7','').replace('maj',''),m[2].replace(/sus[24]|add9|7sus4/,''),m[2].replace(/m?(9|6|11|13)$/,x=>x.startsWith('m')?'m7':'7'),m[2].replace(/(7|9|6|11|13|maj7|add9|sus[24])$/,''),m[2].replace(/[^m].*$/,'')];
 for(const r of roots)for(const s of q){if(SHAPES[r+s])return r+s}return null}
const shape=c=>{const k=chordKey(c);const s=k&&SHAPES[k];return s?[...s].map((ch,i)=>[5-i,ch==='x'?-1:+ch]):null};

const OPENM=[64,59,55,50,45,40];
const NOTE=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const SCALES={
 ionian:{n:'Major (Ionian)',iv:[0,2,4,5,7,9,11],d:'The major scale: bright and resolved. Every other mode is this scale started from a different note.'},

const SHAPESET={nps:'Box positions',nps4:'Diagonal across the neck',string:'Along one string',connect:'All positions, connected'};
const SEQS={updown:'Up and down',threes:'Groups of 3',fours:'Groups of 4',thirds:'In thirds'};
function scaleMidi(key,iv){const o=[];for(let m=40;m<=100;m++)if(iv.includes(((m-key)%12+12)%12))o.push(m);return o}
function fitFrets(a){let mn=Math.min(...a.map(x=>x[1])),mx=Math.max(...a.map(x=>x[1]));if(mn<0)a.forEach(x=>{x[1]+=12;x[2]+=12});else if(mx>19&&mn>=12)a.forEach(x=>{x[1]-=12;x[2]-=12});return a}
function npsPos(key,iv,pos,k,diag){const all=scaleMidi(key,iv);const deg=m=>iv.indexOf(((m-key)%12+12)%12);
 let st=all.find(m=>m>=40&&m<=51&&deg(m)===pos%iv.length);if(diag==='low'||(diag&&st-40>6))st=all[0];const i=all.indexOf(st),ns=all.slice(i,i+6*k),o=[];
 for(let q=0;q<6;q++){const s=5-q;for(let j=0;j<k;j++){const m=ns[q*k+j];o.push([s,m-OPENM[s],m])}}const r=fitFrets(o);if(diag&&st!==all[0]&&Math.max(...r.map(x=>x[1]))>22)return npsPos(key,iv,-1,k,'low');return r}
function winPos(key,iv,w){const o=[];let last=0;for(let s=5;s>=0;s--)for(let f=Math.max(0,w);f<=w+3;f++){const m=OPENM[s]+f;if(m>last&&iv.includes(((m-key)%12+12)%12)){o.push([s,f,m]);last=m}}return o}
function posCount(sc){return SCALES[sc].iv.length===7?7:5}
function boxPos(key,sc,pos){const iv=SCALES[sc].iv;
 if(iv.length===7)return npsPos(key,iv,pos,3);
 if(iv.length===5)return npsPos(key,iv,pos,2);
 const ref=npsPos(key,SCALES.minpent.iv,pos,2);return winPos(key,iv,Math.min(...ref.map(x=>x[1])))}
function oneString(key,iv,s){const o=[];for(let f=0;f<=12;f++){const m=OPENM[s]+f;if(iv.includes(((m-key)%12+12)%12))o.push([s,f,m])}return o}
function applySeq(u,k){const d=u.slice().reverse(),grp=(a,n)=>{const o=[];for(let i=0;i+n<=a.length;i++)o.push(...a.slice(i,i+n));return o},th=a=>{const o=[];for(let i=0;i+2<a.length;i++)o.push(a[i],a[i+2]);return o};
 if(k==='threes')return [...grp(u,3),...grp(d,3)];if(k==='fours')return [...grp(u,4),...grp(d,4)];if(k==='thirds')return [...th(u),...th(d)];return [...u,...u.slice(1,-1).reverse()]}
function scaleBuild(c){const sc=SCALES[c.sc],iv=sc.iv;let notes,map;
 if(c.pat==='string'){const u=oneString(c.key,iv,c.str);notes=applySeq(u,c.seq);map=u}
 else if(c.pat==='nps4'){const u=npsPos(c.key,iv,0,iv.length===7?4:3,true);notes=applySeq(u,c.seq);map=u}
 else if(c.pat==='connect'){const ps=[...Array(posCount(c.sc))].map((_,p)=>boxPos(c.key,c.sc,p)).sort((a,b)=>Math.min(...a.map(x=>x[1]))-Math.min(...b.map(x=>x[1])));notes=[];ps.forEach((p,i)=>notes.push(...(i%2?p.slice().reverse():p)));map=ps.flat()}
 else{const u=boxPos(c.key,c.sc,c.pos||0);notes=applySeq(u,c.seq);map=u}
 let k=0;const steps=notes.map((x,i)=>{const pr=notes[i-1],st={n:[[x[0],x[1]]]};if(c.legato&&pr&&pr[0]===x[0]){st.t=x[2]>pr[2]?'h':'p'}else st.p=k++%2?'u':'d';return st});
 const seen={};map=map.filter(x=>{const q=x[0]+'-'+x[1];if(seen[q])return false;return seen[q]=1}).map(x=>[x[0],x[1],((x[2]-c.key)%12+12)%12===0]);
 return {steps,map}}
function scaleName(c){const sc=SCALES[c.sc],nm=/^(Major|Minor|Natural|Harmonic|Melodic|Blues)/.test(sc.n)?sc.n[0].toLowerCase()+sc.n.slice(1):sc.n;const where=c.pat==='string'?`along the ${SN[c.str]} string`:c.pat==='nps4'?'diagonal':c.pat==='connect'?'all positions':`position ${(c.pos||0)+1}`;return `${NOTE[c.key]} ${nm}, ${where}${c.seq&&c.seq!=='updown'?', '+SEQS[c.seq].toLowerCase():''}${c.legato?', legato':''}`}
function scaleItem(c,extra){const r=scaleBuild(c);const spb=c.spb||(c.seq==='threes'?3:4);return Object.assign({id:'sc-'+[c.key,c.sc,c.pat,c.pos||0,c.str||0,c.seq,c.legato?1:0].join('-'),name:scaleName(c),spb,bpb:4,start:55,target:110,tip:SCALES[c.sc].d+' Say or think the root note (ringed on the fretboard) every time you pass it.',steps:r.steps,map:r.map,cfg:c},extra||{})}
function scalePreset(id,name,c,tip,extra){const it=scaleItem(c);return Object.assign({id,name,spb:it.spb,bpb:4,start:55,target:110,tip:tip||it.tip,map:it.map,build:()=>it.steps.map(s=>({...s}))},extra||{})}

/* seq = single notes, alternate picking (legato h, p, / and tap t are not picked)
   strum = chord pattern, one char per slot: D down, U up, - miss (hand keeps moving)
   FP = one fingerpicked slot: finger label + notes */
const LEG={h:1,p:1,'/':1,t:1,r:1};
function seq(a){let k=0;return a.map(([s,f,t,sf])=>{const st={n:[sf==null?[s,f]:[s,f,sf]]};if(t)st.t=t;if(!LEG[t])st.p=k++%2?'u':'d';return st})}
function fing(a,labels){return a.map(([s,f],i)=>({n:[[s,f]],t:labels[i%labels.length]}))}
function updown(u){return [...u,...u.slice(1,-1).reverse()]}
function strum(prog,pat,reps){const o=[];let prev=null;for(const c of prog)for(let r=0;r<(reps||1);r++)[...pat].forEach((ch,i)=>{const miss=ch==='-';o.push({c,n:miss?[]:shape(c),p:ch==='U'?'u':ch==='D'?'d':(i%2?'u':'d'),miss,first:c!==prev});prev=c});return o}
const FP=(t,...n)=>({n,t});
const rep=(a,k)=>Array.from({length:k},()=>a).flat();
const bars=(st,spb,bpb)=>{st.forEach((x,i)=>x.bar=i%(spb*bpb)===0);return st};
const PENT={5:[5,8],4:[5,7],3:[5,7],2:[5,7],1:[5,8],0:[5,8]};
const PBOX=[[5,5],[5,8],[4,5],[4,7],[3,5],[3,7],[2,5],[2,7],[1,5],[1,8],[0,5],[0,8]];
const CMAJ=[[4,3],[3,0],[3,2],[3,3],[2,0],[2,2],[1,0],[1,1],[1,3],[0,0],[0,1],[0,3]];
const PERMS=(()=>{const o=[],f=(a,r)=>{if(!r.length)return o.push(a);r.forEach((x,i)=>f([...a,x],[...r.slice(0,i),...r.slice(i+1)]))};f([],[1,2,3,4]);return o})();
const PC=(nm,n)=>({nm,n});
const POW={E5:[[5,0],[4,2]],G5:[[5,3],[4,5]],A5:[[5,5],[4,7]],C5:[[5,8],[4,10]],D5:[[4,5],[3,7]],F5:[[4,8],[3,10]],C5a:[[4,3],[3,5]],G5a:[[4,10],[3,12]]};
function powerRun(list,per,lab){const o=[];for(const nm of list)for(let i=0;i<per;i++)o.push({n:POW[nm],p:'d',t:i?(lab||''):nm.replace('a','')});return o}
function boogie(seqs){const o=[];for(const[c,r,u,hi]of seqs)[2,2,hi,hi,2,2,hi,hi].forEach((f,j)=>o.push({n:[[r,0],[u,f]],p:'d',t:j?'':c}));return o}

/* ---------- lick notation ----------
   Tokens separated by spaces, '|' is just a visual bar line.
   <string><fret>  strings: e B G D A E (e = high, E = low), fret number or x (muted)
   suffixes: h hammer-on, p pull-off, / slide up into, \ slide down into, t tap,
             b<fret> bend to that fret's pitch, r release (from a bend),
             ~ vibrato, . palm mute, v / ^ force down / up pick,
             :n hold for n slots, *n repeat n times (picked)
   G7+B8  two or more notes together.   -  rest (one slot) */
const SI={e:0,B:1,G:2,D:3,A:4,E:5};
function lk(src){const out=[];let k=0;
 for(const raw of src.trim().split(/\s+/)){if(raw==='|')continue;if(raw==='-'){out.push({n:[]});continue}
  let tok=raw,times=1,len=1,pk=null;let m=tok.match(/\*(\d+)$/);if(m){times=+m[1];tok=tok.slice(0,m.index)}
  m=tok.match(/:(\d+)$/);if(m){len=+m[1];tok=tok.slice(0,m.index)}
  if(/[v^]$/.test(tok)){pk=tok.endsWith('v')?'d':'u';tok=tok.slice(0,-1)}
  const n=[];let tech='',vib=false,pm=false,bl='';
  for(const p of tok.split('+')){const q=p.match(/^([eBGDAE])(x|\d+)(.*)$/);if(!q)throw new Error('bad lick token '+raw);
   const s=SI[q[1]],f=q[2]==='x'?-1:+q[2];let rest=q[3],sf=null;
   if(rest.includes('~')){vib=true;rest=rest.replace('~','')}if(rest.includes('.')){pm=true;rest=rest.replace('.','')}
   const mb=rest.match(/^b(\d+)$/);if(mb){sf=+mb[1];const d=sf-f;bl=d===1?'b½':d===3?'b1½':'b';tech='b'}else if(rest)tech=rest;
   n.push(sf==null?[s,f]:[s,f,sf])}
  const leg=['h','p','/','\\','t','r'].includes(tech),lab=(tech==='b'?bl:tech)+(vib?'~':'')+(pm?((tech||vib)?' PM':'PM'):'');
  for(let r=0;r<times;r++){const st={n:n.map(x=>x.slice())};if(lab)st.t=lab;if(len>1)st.len=len;
   if(leg&&r===0)st.leg=1;else{st.p=pk||(k%2?'u':'d');k=st.p==='d'?1:0}
   out.push(st);for(let q=1;q<len;q++)out.push({n:[]})}}
 return out}
const LK=(id,name,src,o)=>Object.assign({id,name,spb:2,bpb:4,start:50,target:100,build:()=>lk(src)},o);

  {id:'l2-perm2',name:'Finger permutations, part 2',spb:4,bpb:4,start:50,target:100,tip:'The twelve orders starting with 3 or 4: the awkward ones. These are the ones that unlock real independence.',build(){const a=[];PERMS.slice(12).forEach((p,i)=>p.forEach(x=>a.push([5-(i%6),4+x])));return seq(a)}},
  {id:'l2-stretch',name:'Wide stretch 1-3-4',spb:3,bpb:4,start:50,target:100,tip:'Frets 7, 9 and 10. Thumb low behind the neck, palm off the neck. When it feels easy, move it down two frets.',build(){const a=[];for(let s=5;s>=0;s--)a.push([s,7],[s,9],[s,10]);for(let s=0;s<6;s++)a.push([s,10],[s,9],[s,7]);return seq(a)}},
  {id:'l2-pinky',name:'Pinky workout',spb:4,bpb:4,start:55,target:110,tip:'Every pair ends on the pinky at fret 8. Press with the tip of the pinky, slightly curled, not flat.',build(){const a=[];for(let s=5;s>=0;s--)a.push([s,5],[s,8],[s,6],[s,8],[s,7],[s,8],[s,6],[s,8]);return seq(a)}},
  {id:'l2-trills',name:'Trill builder: every finger pair',spb:4,bpb:4,start:50,target:110,tip:'Left hand only after the first pick of each pair: 1-2, 1-3, 1-4, 2-3, 2-4, 3-4 on the G string. Builds strength for legato.',build(){const a=[];for(const[x,y]of[[1,2],[1,3],[1,4],[2,3],[2,4],[3,4]]){a.push([2,4+x]);for(let i=1;i<8;i++)a.push(i%2?[2,4+y,'h']:[2,4+x,'p'])}return seq(a)}},
  {id:'d-burst',name:'Single-string bursts',spb:4,bpb:4,start:70,target:150,tip:'Frets 5-7-8-7 on the G string. Pick from the wrist with a tiny motion, the pick barely clearing the string. Push this one hardest.',build(){return seq(Array.from({length:16},(_,i)=>[2,[5,7,8,7][i%4]]))}},
  {id:'l2-cross',name:'String-crossing pairs',spb:4,bpb:4,start:55,target:110,tip:'Two strings at a time. Crossing strings is where picking falls apart, so watch that down-up never breaks.',build(){const u=[];for(let s=5;s>0;s--)u.push([s,5],[s-1,5],[s,7],[s-1,7]);return seq([...u,...u.slice().reverse()])}},
  {id:'l2-skipchrom',name:'Chromatic with string skips',spb:4,bpb:4,start:50,target:100,tip:'1-2-3-4 on one string, then skip a string. Keep the picking hand relaxed as it jumps.',build(){const a=[];for(const s of[5,3,4,2,3,1,2,0])for(const f of[5,6,7,8])a.push([s,f]);return seq(a)}},
  {id:'l2-inout',name:'In-and-out 1-2-3-4-3-2',spb:3,bpb:4,start:55,target:110,tip:'Up and back on each string in triplets. Lift fingers only as far as needed: a millimetre, not a centimetre.',build(){const a=[];for(let s=5;s>=0;s--)a.push([s,5],[s,6],[s,7],[s,8],[s,7],[s,6]);return seq(a)}}
 ]},
 {name:'Level 3: Scales',desc:'Open-position major scales, the pentatonic and blues boxes, and sequences that turn scales into music. Level 8 takes these across the whole neck.',ex:[
  {id:'l3-cmaj',name:'C major scale, open position',spb:2,bpb:4,start:60,target:120,tip:'Say the note names as you play: C D E F G A B C. Fret 1 = index, fret 2 = middle, fret 3 = ring.',build:()=>seq(updown(CMAJ))},
  {id:'l3-gmaj',name:'G major scale, open position',spb:2,bpb:4,start:60,target:120,tip:'Two full octaves from the low G. F# on the D string (fret 4) uses the pinky.',build:()=>seq(updown([[5,3],[4,0],[4,2],[4,3],[3,0],[3,2],[3,4],[2,0],[2,2],[1,0],[1,1],[1,3],[0,0],[0,2],[0,3]]))},
  {id:'l3-amin',name:'A natural minor, open position',spb:2,bpb:4,start:60,target:120,tip:'Same notes as C major, but home is A. Hear how the same notes sound sad when you start and end on A.',build:()=>seq(updown([[4,0],[4,2],[4,3],[3,0],[3,2],[3,3],[2,0],[2,2],[1,0],[1,1],[1,3],[0,0],[0,1],[0,3],[0,5]]))},
  {id:'l3-epent',name:'E minor pentatonic, open position',spb:2,bpb:4,start:60,target:120,tip:'The open-string pentatonic: E G A B D. Great for riffs with ringing open strings.',build:()=>seq(updown([[5,0],[5,3],[4,0],[4,2],[3,0],[3,2],[2,0],[2,2],[1,0],[1,3],[0,0],[0,3]]))},
  {id:'l3-g2',name:'G major, two octaves, 2nd position',spb:4,bpb:4,start:55,target:110,tip:'A movable shape with no open strings: shift it up two frets and it becomes A major.',build:()=>seq(updown([[5,3],[5,5],[4,2],[4,3],[4,5],[3,2],[3,4],[3,5],[2,2],[2,4],[2,5],[1,3],[1,5],[0,2],[0,3]]))},
  {id:'d-penta',name:'A minor pentatonic, box 1',spb:4,bpb:4,start:60,target:120,tip:'The most used scale in rock and blues. Pick direction keeps alternating when you change strings.',build:()=>seq([...PBOX,...PBOX.slice(1,-1).reverse()]),map:PBOX.map(([s,f])=>[s,f,(OPENM[s]+f-9)%12===0])},
  {id:'l3-pent2',name:'A minor pentatonic, box 2',spb:4,bpb:4,start:55,target:110,tip:'Connects to box 1 on its right. Play box 1 then box 2 to start seeing the neck as one map.',build:()=>seq(updown([[5,8],[5,10],[4,7],[4,10],[3,7],[3,10],[2,7],[2,9],[1,8],[1,10],[0,8],[0,10]]))},
  {id:'l3-cpent',name:'C major pentatonic',spb:4,bpb:4,start:55,target:110,tip:'Same notes as A minor pentatonic box 1, but C is home. Major pentatonic = minor pentatonic three frets lower.',build:()=>seq(updown([[5,5],[5,8],[4,5],[4,7],[3,5],[3,7],[2,5],[2,7],[1,5],[1,8],[0,5],[0,8]]))},
  {id:'l3-blues',name:'A blues scale',spb:4,bpb:4,start:55,target:110,tip:'Box 1 plus the "blue note" (fret 6 on the A string, fret 8 on the G string). Lean on it briefly; don\'t sit on it.',build:()=>seq(updown([[5,5],[5,8],[4,5],[4,6],[4,7],[3,5],[3,7],[2,5],[2,7],[2,8],[1,5],[1,8],[0,5],[0,8]]))},
  {id:'l3-3s',name:'Pentatonic in threes',spb:3,bpb:4,start:50,target:100,tip:'Groups of three notes over a triplet feel: 1-2-3, 2-3-4, 3-4-5. Sequences like this are the backbone of fast lead lines.',build(){const a=[];for(let i=0;i<=PBOX.length-3;i++)a.push(...PBOX.slice(i,i+3));return seq(a)}},
  {id:'l3-4s',name:'Pentatonic in fours',spb:4,bpb:4,start:50,target:100,tip:'1-2-3-4, 2-3-4-5… Lines up with the beat, so accent the first note of each group.',build(){const a=[];for(let i=0;i<=PBOX.length-4;i++)a.push(...PBOX.slice(i,i+4));return seq(a)}},
  {id:'l3-thirds',name:'C major in thirds',spb:4,bpb:4,start:50,target:100,tip:'Skip a note, step back: C-E, D-F, E-G… It trains your ear and fingers to jump inside a scale.',build(){const a=[];for(let i=0;i+2<CMAJ.length;i++)a.push(CMAJ[i],CMAJ[i+2]);return seq(a)}},
  {id:'l3-c4s',name:'C major in fours',spb:4,bpb:4,start:50,target:100,tip:'C-D-E-F, D-E-F-G… the classic scale sequence from 19th-century methods. Keep every group even.',build(){const a=[];for(let i=0;i+4<=CMAJ.length;i++)a.push(...CMAJ.slice(i,i+4));return seq(a)}},
  {id:'l3-6s',name:'Descending pentatonic sixes',spb:3,bpb:4,start:50,target:100,tip:'A rock-lead staple: six-note groups falling through box 1. Two triplets per click.',build(){const d=PBOX.slice().reverse(),a=[];for(let i=0;i+6<=d.length;i+=2)a.push(...d.slice(i,i+6));return seq(a)}}
 ]},
 {name:'Level 4: Rock and metal rhythm I',desc:'Power chords, palm muting, chugs, gallops and downpicking: the right-hand engine of rock and metal. PM = palm mute: rest the edge of your picking hand on the strings right at the bridge.',ex:[
  {id:'l4-power',name:'Power chord shifts',spb:2,bpb:4,start:60,target:130,tip:'Index on the root, ring finger two frets up on the next string. All downstrokes, palm-muted. Release finger pressure (not contact) while you move so the shift stays silent.',build:()=>powerRun(['E5','G5','A5','C5'],8,'PM')},
  {id:'l4-powera',name:'Power chords on the A string',spb:2,bpb:4,start:60,target:130,tip:'Same shape with the root on the A string. Mixing E- and A-string roots keeps riffs in one area of the neck. Let your index tip touch the low E so it stays silent.',build:()=>powerRun(['A5','C5a','D5','F5','G5a','F5','D5','C5a'],4,'')},
  LK('l4-power3','Three-note power chords (root, fifth, octave)','E0+A2+D2:2 E0+A2+D2 E0+A2+D2 E3+A5+D5:2 E3+A5+D5 E3+A5+D5 | E5+A7+D7:2 E5+A7+D7 E5+A7+D7 E3+A5+D5:2 E2+A4+D4 E2+A4+D4',{start:60,target:120,tip:'Add the octave with your pinky (or flatten the ring finger across two strings). Fuller and heavier than the two-note shape. Downstrokes only.'}),
  LK('l4-chug8','Palm-muted eighth chugs with accents','E0. E0. E0. E3+A5 E0. E0. E0. E5+A7 | E0. E0. E0. E3+A5 E0. E5+A7 E3+A5 E0.',{start:70,target:160,tip:'Mute the open E with the palm for a tight chug, then lift the palm slightly for the power-chord accents. Downpick everything.'}),
  LK('l4-chug16','Sixteenth-note chugs',`E0.*8 E3+A5:2 E0.*6 | E0.*8 E5+A7:2 E3+A5:2 E0.*4`,{spb:4,start:60,target:140,tip:'Alternate-picked 16ths on the muted low E. Keep the motion small and from the wrist; the accents land exactly on the beat.'}),
  {id:'l4-gallop',name:'Gallop rhythm',spb:4,bpb:4,start:60,target:140,tip:'Eighth, sixteenth, sixteenth: down, (rest), down-up on every beat. The core of countless metal riffs. Keep the palm mute light.',build(){const o=[];for(const[nm,b]of[['E5',8],['G5',4],['A5',4]])for(let k=0;k<b;k++){const n=POW[nm];o.push({n,p:'d',t:k?'':nm},{n:[]},{n,p:'d'},{n,p:'u'})}return o}},
  LK('l4-rgallop','Reverse gallop','E0.v E0.^ E0.v - E0.v E0.^ E0.v - E0.v E0.^ E3+A5v - E0.v E0.^ E5+A7v - | E0.v E0.^ E0.v - E0.v E0.^ E0.v - E0.v E0.^ E7+A9v - E0.v E0.^ E5+A7v -',{spb:4,start:60,target:140,tip:'Two sixteenths then an eighth: down-up, down. The mirror image of the gallop; it pushes forward instead of galloping.'}),
  {id:'l4-accent',name:'Palm-mute and open accents',spb:2,bpb:4,start:60,target:130,tip:'Muted chugs, then let the accent ring open. Lift the palm only for the accent, then drop it back.',build(){const o=[];for(const nm of['E5','E5','G5','A5'])[1,0,0,1,0,0,1,0].forEach(a=>o.push({n:POW[nm],p:'d',t:a?'open':'PM'}));return o}},
  LK('l4-down','Downpicking stamina','E0+A2v*8 E3+A5v*8 | E5+A7v*8 E3+A5v*4 E2+A4v*4',{start:100,target:200,tip:'Constant eighth-note downstrokes. Relax the forearm, rotate from the wrist and keep the stroke short. Stop if you feel tension, then build tempo over weeks.'}),
  LK('l4-chrom','Chromatic power chord moves','E0+A2:2 E1+A3:2 E2+A4:2 E3+A5:2 | E0+A2:2 E3+A5 E2+A4 E1+A3:2 E0+A2:2',{start:60,target:130,tip:'Moving one fret at a time is a metal staple. Keep the hand shape locked and move from the elbow.'}),
  LK('l4-trem','Tremolo picking',`E0.*8 E1.*8 | E3+A5*8 E2+A4*8`,{spb:4,start:60,target:150,tip:'Fast, even alternate picking on one note or chord. Hold the pick firmly, keep the wrist loose, and stay just above the string.'})
 ]},
 {name:'Level 5: Rock and metal rhythm II',desc:'Real riffs and grooves built from level 4 skills, blues-rock boogies, strumming patterns and barre chords.',ex:[
  LK('l5-r1','Riff: E minor pentatonic rock riff','E0 E0 E3 E0 A0 E0 A2 A0 | E0 E0 E3 E0 A2 A0 E3 E0',{start:70,target:140,tip:'Uses alternate picking and the open low E. Keep the open string short and punchy with a light palm mute.'}),
  LK('l5-r2','Riff: pedal-point chug','E0. E0. A2 E0. E0. A3 E0. E0. A5 E0. A3 E0. A2 E0. E0. E0.',{spb:4,start:60,target:140,tip:'The muted open E keeps chugging under a moving melody on the A string: a thrash-metal classic idea. Unmute the melody notes.'}),
  LK('l5-r3','Riff: power chords over an open-E chug','E0. E0. E3+A5 E0. E0. E5+A7 E0. E0. E7+A9 E0. E5+A7 E0. E3+A5 E0. E0. E0.',{spb:4,start:60,target:140,tip:'Combines 16th chugs and power-chord shifts. Every chug is muted; every chord rings.'}),
  LK('l5-r4','Riff: thrash gallop','E0. - E0. E0. E0. - E0. E0. E3+A5 - E3+A5 E3+A5 E5+A7 - E5+A7 E5+A7',{spb:4,start:60,target:150,tip:'The gallop from level 4 moving between chords. Accent the first note of each gallop.'}),
  LK('l5-r5','Riff: chromatic riff with the tritone','E0+A2:2 E1+A3 E0+A2 E6+A8:2 E3+A5 E2+A4 | E0+A2:2 E1+A3 E0+A2 E3+A5 E2+A4 E1+A3 E0+A2',{start:60,target:130,tip:'The Bb5 against the E (6 frets apart) is the tritone, the darkest interval in metal. Downstrokes, heavy palm on the E5s.'}),
  LK('l5-r6','Riff: open-string rock riff in A','A0 A0 A3 A0 A5 A0 A3 A5 | D0 D0 D2 D0 D5 D2 D0 A3',{start:70,target:150,tip:'A hard-rock style eighth-note riff around open strings. Alternate picking, accents on the fretted notes.'}),
  LK('l5-r7','Riff: stop-start stabs','E0+A2:2 - E0+A2 - - E3+A5 E5+A7 | E0+A2:2 - E0+A2 - E5+A7 E3+A5 -',{start:60,target:130,tip:'The silences are part of the riff. Kill each chord exactly on the rest by releasing fretting pressure and touching the strings with your picking palm.'}),
  LK('l5-r8','Riff: tremolo-picked chords','E0+A2*8 E3+A5*8 | E2+A4*8 E1+A3*8',{spb:4,start:60,target:150,tip:'Tremolo picking on power chords, an extreme-metal sound. Even 16ths, no palm mute, let it roar.'}),
  {id:'l4-boogie',name:'Groove: 12-bar boogie in A',spb:2,bpb:4,start:60,target:140,tip:'A A A A, D D A A, E D A E: the shape of thousands of blues and rock songs. Swing the eighths (long-short) once it is steady.',build(){const P={A:['A',4,3,4],D:['D',3,2,4],E:['E',5,4,4]};return boogie([...'AAAADDAAEDAE'].map(c=>P[c]))}},
  {id:'l4-shuffleE',name:'Groove: 12-bar shuffle in E',spb:2,bpb:4,start:60,target:140,tip:'The boogie idea in E. The B chord uses the A string at fret 2 with the D string at 4 and 6: a stretch, so keep the thumb low.',build(){const o=[];for(const c of'EEEEAAEEBAEB'){const[r,rf,u,lo,hi]={E:[5,0,4,2,4],A:[4,0,3,2,4],B:[4,2,3,4,6]}[c];[lo,lo,hi,hi,lo,lo,hi,hi].forEach((f,j)=>o.push({n:[[r,rf],[u,f]],p:'d',t:j?'':c}))}return o}},
  {id:'l4-turn',name:'Groove: blues-rock turnaround',spb:2,bpb:4,start:55,target:110,tip:'A high A rings on top while a line walks down chromatically on the G string, landing on E7. Every blues-rock chorus ends like this.',build(){const o=[];[8,7,6,5].forEach(f=>{o.push({n:[[0,5],[2,f]],p:'d'},{n:[[0,5],[2,f]],p:'u'})});const e7=shape('E7').filter(x=>x[1]>=0);for(let i=0;i<8;i++)o.push(i%4===0?{n:e7,p:'d',t:i?'':'E7'}:{n:[]});return o}},
  {id:'l4-16',name:'Strumming: 16th notes',chord:true,spb:4,bpb:4,start:50,target:100,tip:'Four strums per click. Small, loose wrist; accent the down strum on each beat.',build:()=>strum(['Em','C','G','D'],'DUDUDUDUDUDUDUDU')},
  {id:'l4-16syn',name:'Strumming: syncopated rock pattern',chord:true,spb:4,bpb:4,start:50,target:95,tip:'The hand keeps moving in 16ths, but only some strokes hit. Count 1 e & a out loud the first few times.',build:()=>strum(['Em','C','G','D'],'D--UD-U-D-DU--DU')},
  {id:'l4-68',name:'Strumming: 6/8 power ballad',chord:true,spb:3,bpb:2,start:40,target:80,tip:'Two big beats per bar, each split in three: ONE two three FOUR five six. The rock-ballad feel.',build:()=>strum(['Em','C','G','D'],'D-UD-U')},
  {id:'l4-f',name:'Barre chords: F',chord:true,spb:1,bpb:4,start:40,target:90,tip:'Roll the index slightly onto its bony side, right behind the fret. Pull back with the arm rather than squeezing with the thumb.',build:()=>strum(['C','F','G','F'],'DDDD')},
  {id:'l4-bm',name:'Barre chords: Bm',chord:true,spb:1,bpb:4,start:40,target:90,tip:'Bm is an A-minor shape barred at fret 2. Land the barre first, then the other three fingers.',build:()=>strum(['D','Bm','G','A'],'DDDD')},
  {id:'l4-barres',name:'Barre chords: E and A shapes',chord:true,spb:1,bpb:4,start:40,target:90,tip:'F#m and F# use the E shape at fret 2; B and C#m use the A shape. Move the barre without fully releasing it.',build:()=>strum(['A','F#m','B','E','F#','C#m','B','E'],'DDDD')}
 ]},
 {name:'Level 6: Lead guitar I',desc:'One technique at a time: a drill to learn it, then licks that use it together with everything learned before. Hammer-ons, pull-offs, legato, slides, bends, vibrato and double stops, ending in a full solo.',ex:[
  {id:'l6-ham',name:'Hammer-ons: drill',spb:2,bpb:4,start:50,target:110,tip:'Pick the first note, then hammer the second (h) with the fingertip from a little height. Both notes should be equally loud.',build(){const a=[];for(let s=5;s>=0;s--)a.push([s,PENT[s][0]],[s,PENT[s][1],'h']);for(let s=0;s<6;s++)a.push([s,PENT[s][0]],[s,PENT[s][1],'h']);return seq(a)}},
  LK('ld-h1','Hammer-ons: lick','D5 D7h G5 G7h B5 B8h e5:2 | B8 G7 G5 D7:2 - - -',{tip:'Pick, hammer, pick, hammer up the A minor pentatonic, then pick your way back. Skills: alternate picking, hammer-ons.'}),
  {id:'l6-pull',name:'Pull-offs: drill',spb:2,bpb:4,start:50,target:110,tip:'Pick the high note, then pull off (p) slightly downwards, almost plucking with the fretting finger. The lower finger must already be in place.',build(){const a=[];for(let s=0;s<6;s++)a.push([s,PENT[s][1]],[s,PENT[s][0],'p']);for(let s=5;s>=0;s--)a.push([s,PENT[s][1]],[s,PENT[s][0],'p']);return seq(a)}},
  LK('ld-p1','Pull-offs: lick with hammer-ons','e8 e5p B8 B5p G7 G5p D7:2 | D5 D7h G5 G7h G5p D7 A5:2',{tip:'Pull-offs coming down, hammer-ons going up, and a hammer-pull on the G string. Skills: hammer-ons, pull-offs.'}),
  LK('ld-p2','Pull-offs: open-string metal lick','e3 e0p B3 B0p G2 G0p D2 D0p | E3 E0p E2 E0p E3 E0p E0:2',{spb:4,start:50,target:120,tip:'Pull-offs to open strings in E minor, fast and aggressive. Snap each pull-off so the open string rings as loud as the picked note.'}),
  {id:'l6-trill',name:'Legato: trill drill',spb:4,bpb:4,start:50,target:120,tip:'Pick only the first note, then hammer and pull between frets 5 and 7 on the G string. Even, like a drum roll.',build(){const a=[[2,5]];for(let i=1;i<16;i++)a.push(i%2?[2,7,'h']:[2,5,'p']);return seq(a)}},
  {id:'l6-leg3',name:'Legato: three notes per string drill',spb:3,bpb:4,start:50,target:100,tip:'A minor three notes per string: pick the first note on each string, hammer the other two going up, pull off coming down.',build:()=>scaleItem({key:9,sc:'aeolian',pat:'nps',pos:0,seq:'updown',legato:true}).steps},
  LK('ld-l1','Legato: flowing A minor run','E5 E7h E8h A5 A7h A8h D7 D9h D10h G7 G9h G10h | G10 G9p G7p D10 D9p D7p A8 A7p A5p E8 E7p E5p',{spb:3,start:50,target:110,tip:'One pick per string, the rest legato. Aim for every note at the same volume. Skills: hammer-ons, pull-offs, legato.'}),
  {id:'l6-slide',name:'Slides: drill',spb:2,bpb:4,start:50,target:100,tip:'Pick, then keep pressure on as you slide (/) to the next note. Ease off the pressure and the note dies.',build(){const a=[];for(let s=3;s>=0;s--)a.push([s,PENT[s][0]],[s,PENT[s][1],'/']);return seq(a)}},
  {id:'l6-shift',name:'Slides: shifting between boxes',spb:2,bpb:4,start:50,target:100,tip:'Slide from pentatonic box 1 into box 2 on the top strings. Sliding is how players move around the neck smoothly.',build(){const a=[];for(const s of[2,1,0]){const lo=PENT[s];a.push([s,lo[0]],[s,lo[1]],[s,lo[1]+2,'/'],[s,lo[1]])}return seq(a)}},
  LK('ld-s1','Slides: lick into box 2','G5 G7/ B5 B8 B10/:2 B8 B5 | G9 G7\\ G5 D7:2 - - -',{tip:'Slide up into box 2, come back, and slide down into the G string. Skills: picking, slides.'}),
  LK('ld-s2','Slides: lick across the neck','A5 A7 D5 D7 D10/ G7 G9 B8 | B10 e8 e10 e12/:2 e10 B10 B8 | G9:2 G7 D7:3 - -',{start:50,target:110,tip:'Climbs from box 1 to the 12th fret using slides on the D and high e strings. Skills: picking, hammer-ons, slides.'}),
  {id:'l6-bend',name:'Bends: drill to pitch',spb:1,bpb:4,start:50,target:80,tip:'First play the target note, then bend the lower fret up until it matches (you hear the target as the guide). Push with the ring finger backed by middle and index.',build(){return seq(rep([[2,9,'target'],[2,7,'b',9],[1,10,'target'],[1,8,'b',10]],2))}},

/* ---------- song parsing ---------- */
function parseSong(sg){
 const L=sg.text.replace(/\r/g,'').split('\n'),sys=[];let run=[];
 for(const ln of L){const m=ln.match(/^\s*[A-Ga-g][#b]?\s*[|:](.*)$/);if(m&&/-/.test(m[1])){run.push(m[1]);if(run.length===6){sys.push(run);run=[]}}else run=[]}
 if(!sys.length){
  const CH=/^([A-G][#b]?(?:maj7|maj9|maj|m7b5|m7|m9|m6|m|7sus4|7|9|11|13|6|5|sus2|sus4|add9|dim7|dim|aug|\+)?(?:\/[A-G][#b]?)?)(?::(\d+))?$/;
  const toksOf=l=>l.replace(/[()|]/g,' ').trim().split(/\s+/).filter(t=>t&&!/^\[.*\]$/.test(t)&&!/^[x×]\d+$/i.test(t)&&t!=='-'&&t!=='%');
  const lines=sg.text.split('\n'),cl=lines.filter(l=>{const t=toksOf(l);return t.length&&t.every(x=>CH.test(x))});
  const toks=(cl.length?cl:lines).flatMap(toksOf);
  const st=[];let prev=null;for(const t of toks){const m=t.match(CH);if(!m)continue;const k=m[2]?+m[2]:sg.bpb;for(let b=0;b<k;b++)st.push({c:m[1],first:b===0,n:shape(m[1]),p:'d'})}
  st.forEach((x,i)=>x.bar=i%sg.bpb===0);return {steps:st,chord:true,spb:1};
 }
 const st=[];let pend=true,k=0;
 for(const S of sys){
  const len=Math.max(...S.map(x=>x.length)),R=S.map(x=>x.padEnd(len,'-')),skip=[-1,-1,-1,-1,-1,-1];
  for(let c=0;c<len;c++){
   if(R.some(r=>r[c]==='|')){pend=true;continue}
   const n=[];
   for(let s=0;s<6;s++){if(skip[s]===c)continue;const ch=R[s][c];
    if(/\d/.test(ch)){const nx=R[s][c+1];if(nx&&/\d/.test(nx)&&+(ch+nx)<=24){n.push([s,+(ch+nx)]);skip[s]=c+1}else n.push([s,+ch])}
    else if(ch==='x'||ch==='X')n.push([s,-1])}
   if(n.length){st.push({n,bar:pend,p:k++%2?'u':'d'});pend=false}
   else if(sg.mode==='dash'){st.push({n:[],bar:pend});pend=false}
  }
  pend=true;
 }
 if(sg.mode==='dash')st.forEach((x,i)=>{if(x.n.length)x.p=i%2?'u':'d'});
 return {steps:st,chord:false,spb:sg.spb};
}

   <div class="row">${desk?'<button type="button" id="f-imp" class="primary"><svg aria-hidden="true" class="ic"><use href="#i-import"/></svg>Import from tab window</button>':''}<button type="button" id="f-paste"><svg aria-hidden="true" class="ic"><use href="#i-paste"/></svg>Paste from clipboard</button></div>
   <label><span>Name <span aria-hidden="true" style="color:var(--acc)">*</span></span><input type="text" id="f-name" autocomplete="off" value="${esc(s.name)}" required></label>
   <div class="two"><label>Full tempo<input type="number" id="f-bpm" min="30" max="260" value="${s.bpm}"></label><label>Beats/bar<input type="number" id="f-bpb" min="2" max="12" value="${s.bpb}"></label><label>Notes/beat<select id="f-spb">${[1,2,3,4].map(n=>`<option${n===s.spb?' selected':''}>${n}</option>`).join('')}</select></label></div>
   <label>Timing for tab<select id="f-mode"><option value="even"${s.mode==='even'?' selected':''}>Even: every note gets one slot</option><option value="dash"${s.mode==='dash'?' selected':''}>Follow dashes: each column is one slot</option></select></label>
   <label>Tab or chords<textarea id="f-text" aria-describedby="f-prev f-err" spellcheck="false" placeholder="Paste a tab or chord sheet here. Lyrics, headings and other text on the page are ignored.">${esc(s.text)}</textarea></label>
   <p class="hint" id="f-prev"></p>
   <p class="err" id="f-err" role="alert"></p>
   <div class="row"><button type="submit" class="primary">Save and practise</button><button type="button" id="f-cancel">Cancel</button></div></form>`;
  }else{
   const openBtn=(url,label,title)=>desk?`<button data-open="${esc(url)}" data-title="${esc(title||label)}"><svg aria-hidden="true" class="ic"><use href="#i-open"/></svg>${esc(label)}</button>`:`<a href="${esc(url)}" target="_blank" rel="noopener"><svg aria-hidden="true" class="ic"><use href="#i-open"/></svg>${esc(label)}</a>`;
   h=`<h3 style="margin-top:0">Find a song</h3><label for="sq" class="flabel">Song or artist</label><form id="sform" class="srch" role="search"><input type="search" id="sq" placeholder="e.g. a song title" value="${esc(sq)}" autocomplete="off"><button type="submit"${sbusy?' disabled aria-busy="true"':''}><svg aria-hidden="true" class="ic"><use href="#i-search"/></svg>${sbusy?'Searching':'Search'}</button></form>
   <p class="hint" style="margin-top:8px">${desk?'Search, open a tab or chord page in the tab window, then press “Import from tab window”. Ultimate Guitar pages import best: their tabs and chord sheets are plain text.':'Search, open a tab page, copy it (Ctrl+A, Ctrl+C), then press “Add a song” and paste. Lyrics and other page text are ignored.'}</p>
   ${sbusy?'<p class="hint loading">Searching</p>':''}
   ${serr==='desktop'?'<p class="hint">Built-in search works in the Fretwork Windows app. Use the links below here.</p>':serr?`<p class="err">${esc(serr)}</p>`:''}
   ${sq?`<div class="acts" style="margin-top:10px">${openBtn(ugUrl(sq),'Search Ultimate Guitar','Ultimate Guitar: '+sq)}${desk?'':openBtn(ssUrl(sq),'Search Songsterr')}</div>`:''}
   ${sres&&sres.length?`<ul class="sres">${sres.map((r,i)=>`<li><b>${esc(r.title)}</b> <small>${esc(r.artist)}</small><div class="acts">${openBtn(r.url,'Open',r.artist+' - '+r.title)}${openBtn(ugUrl(r.artist+' '+r.title),'On Ultimate Guitar',r.title)}</div></li>`).join('')}</ul>`:''}
   ${desk?'<button id="imp" class="primary" style="width:100%;margin-top:12px"><svg aria-hidden="true" class="ic"><use href="#i-import"/></svg>Import from tab window</button>':''}
   <h3>My songs</h3><button id="add" style="width:100%"><svg aria-hidden="true" class="ic"><use href="#i-add"/></svg>Add a song</button>${undo?`<p class="hint" style="margin-top:8px">Deleted ${esc(undo.s.name)}. <button id="undo"><svg aria-hidden="true" class="ic"><use href="#i-undo"/></svg>Undo</button></p>`:''}
   <ul class="list" style="margin-top:12px">${songs.map(s=>itemRow(s,`${s.bpm} bpm · ${parseSong(s).chord?'chords':'tab'}`,`<div class="acts"><button data-ed="${s.id}"><svg aria-hidden="true" class="ic"><use href="#i-edit"/></svg>Edit</button><button data-del="${s.id}"><svg aria-hidden="true" class="ic"><use href="#i-trash"/></svg>Delete</button></div>`)).join('')}</ul>
   ${songs.length?'':'<p class="hint">No songs yet.</p>'}
   ${songs.some(s=>s.sample)?'<p class="note" style="margin-top:10px">The two starter songs are public-domain samples; delete them any time.</p>':''}`;
  }
 }else{
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return {l:d.toLocaleDateString(undefined,{weekday:'short'}),m:(mins[k]||0)/60}});
  const mx=Math.max(10,...days.map(d=>d.m));
  const known=[...DRILLS,...songs.map(s=>({id:s.id,name:s.name,target:s.bpm}))],ids=new Set(known.map(o=>o.id));
  const all=[...known,...Object.entries(prog).filter(([id,p])=>!ids.has(id)&&p.name).map(([id,p])=>({id,name:p.name,target:p.t||110}))].filter(o=>best(o.id)>0);
  const doneN=DRILLS.filter(d=>best(d.id)>=d.target).length;
  h=`<div class="card"><div class="big">${Math.round(days[6].m)} min</div><p class="hint">played today</p><div class="bars" style="margin-top:12px">${days.map(d=>`<div class="bar"><span>${d.l}</span><span class="tr"><i style="width:${d.m/mx*100}%"></i></span><span>${Math.round(d.m)} min</span></div>`).join('')}</div></div>
  <h3>Course</h3><p style="margin:0">${doneN} of ${DRILLS.length} exercises at goal tempo</p><div class="bar" style="grid-template-columns:minmax(0,1fr) 4.2em;margin-top:6px"><span class="tr"><i style="width:${doneN/DRILLS.length*100}%"></i></span><span>${Math.round(doneN/DRILLS.length*100)}%</span></div>
  ${LEVELS.map(L=>{const d=L.ex.filter(e=>best(e.id)>=e.target).length;return `<div class="bar" style="margin-top:4px"><span title="${esc(L.name)}">${esc(L.name.replace(/:.*/,''))}</span><span class="tr"><i style="width:${d/L.ex.length*100}%"></i></span><span>${d}/${L.ex.length}</span></div>`}).join('')}
  <h3>Best clean tempo vs goal</h3>${all.length?'':'<p class="hint">Nothing logged yet. Press “Clean run” after a run you are happy with.</p>'}<div class="bars">${all.map(o=>`<div class="bar"><span title="${esc(o.name)}">${esc(o.name)}</span><span class="tr"><i style="width:${Math.min(100,best(o.id)/o.target*100)}%"></i></span><span>${best(o.id)||'–'}/${o.target}</span></div>`).join('')}</div>
  <p class="hint" style="margin-top:12px">Tempos are logged when you press “Clean run”.</p>`;
 }
 P.innerHTML=h;
 P.querySelectorAll('.item').forEach(el=>{const go=e=>{if(e.target.closest('button'))return;const id=el.dataset.id;const d=DRILLS.find(x=>x.id===id);if(d)select(drillItem(d));else{const s=songs.find(x=>x.id===id);if(s)select(songItem(s))}};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go(e)}});
 P.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{editing=b.dataset.ed;render()});
 P.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=songs.findIndex(x=>x.id===b.dataset.del);undo={s:songs[i],i};songs.splice(i,1);save();render()});
 P.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{try{API().open_page(b.dataset.open,b.dataset.title)}catch(e){}});
 const u=$('#undo');if(u)u.onclick=()=>{songs.splice(undo.i,0,undo.s);undo=null;save();render()};
 const a=$('#add');if(a)a.onclick=()=>{editing='new';draftName='';draftText='';undo=null;render();$('#f-name').focus()};
 const im=$('#imp');if(im)im.onclick=()=>{editing='new';draftName='';draftText='';undo=null;render();importPage()};
 const sf=$('#sform');if(sf)sf.onsubmit=e=>{e.preventDefault();doSearch($('#sq').value)};
 const cf=$('#scf');if(cf)cf.onchange=()=>{const g=id=>$(id);scfg={key:+g('#c-key').value,sc:g('#c-sc').value,pat:g('#c-pat').value,pos:g('#c-pos')?Math.min(+g('#c-pos').value,posCount(g('#c-sc').value)-1):0,str:g('#c-str')?+g('#c-str').value:(scfg.str??2),seq:g('#c-seq').value,spb:+g('#c-spb').value,legato:g('#c-leg').checked};LS.set('fw-scfg',scfg);select(scaleItem(scfg))};
 const f=$('#sf');if(f){
  const prev=()=>{const s={text:$('#f-text').value,bpb:+$('#f-bpb').value||4,spb:+$('#f-spb').value,mode:$('#f-mode').value};$('#f-prev').textContent=chordSummary(parseSong(s),s.bpb)};
  $('#f-text').oninput=prev;$('#f-bpb').oninput=prev;$('#f-mode').onchange=prev;prev();
  const orig=$('#f-text').value+'|'+$('#f-name').value;const cb=$('#f-cancel');cb.onclick=()=>{const dirty=($('#f-text').value+'|'+$('#f-name').value)!==orig;if(dirty&&!cb.dataset.arm){cb.dataset.arm=1;cb.textContent='Discard changes?';cb.classList.add('warn');return}editing=null;draftName='';draftText='';render()};
  $('#f-paste').onclick=async()=>{let t='';const api=API();try{t=api&&api.clipboard?await api.clipboard():await navigator.clipboard.readText()}catch(e){}
   if(!t){$('#f-err').textContent='Could not read the clipboard here. Click in the box and press Ctrl+V instead.';return}$('#f-err').textContent='';$('#f-text').value=t;prev()};
  const fi=$('#f-imp');if(fi)fi.onclick=importPage;
  f.onsubmit=e=>{e.preventDefault();const s={id:editing==='new'?'s-'+Date.now():editing,name:$('#f-name').value.trim()||'Untitled song',bpm:Math.max(30,Math.min(260,+$('#f-bpm').value||90)),bpb:Math.max(2,Math.min(12,+$('#f-bpb').value||4)),spb:+$('#f-spb').value,mode:$('#f-mode').value,text:$('#f-text').value};
   const p=parseSong(s);if(!p.steps.length){$('#f-err').textContent='No tab or chords found. Check that the tab has six lines starting with e| B| G| D| A| E|, or that chords are written like G C Am.';return}
   const i=songs.findIndex(x=>x.id===s.id);if(i>=0)songs[i]=s;else songs.push(s);editing=null;draftText='';save();select(songItem(s))}}
}
async function importPage(){const api=API();if(!api||!api.import_page)return;const e=$('#f-err'),pv=$('#f-prev'),bt=$('#f-imp');if(bt){if(bt.disabled)return;bt.disabled=true;bt.setAttribute('aria-busy','true')}const done=()=>{if(bt){bt.disabled=false;bt.removeAttribute('aria-busy')}};if(pv)pv.textContent='Reading the tab window…';
 let r;try{r=await api.import_page()}catch(x){r={error:'Could not read the tab window.'}}
 done();if(r.error){if(e)e.textContent=r.error;if(pv)pv.textContent='';return}
 const s={text:r.text,bpb:4,spb:2,mode:'even'},p=parseSong(s);
 if(!p.steps.length){if(e)e.textContent='No tab or chords found on that page. Songsterr shows tabs as pictures, so open the song on Ultimate Guitar instead.';if(pv)pv.textContent='';return}
 if(e)e.textContent='';$('#f-text').value=r.text;if(!$('#f-name').value.trim()&&r.title)$('#f-name').value=r.title;$('#f-text').dispatchEvent(new Event('input'))}
const TABS=[['drills','lessons'],['scales','scales'],['songs','songs'],['prog','progress']];
function goTab(k,focus){tab=k;render();if(k==='scales'&&!(item&&item.cfg))select(scaleItem(scfg));try{const hs=TABS.find(t=>t[0]===k)[1];if(location.hash!=='#'+hs)history.replaceState(null,'','#'+hs)}catch(e){}if(focus)$('#t-'+k).focus()}
for(const[k]of TABS){const el=$('#t-'+k);el.onclick=()=>goTab(k);el.onkeydown=e=>{const i=TABS.findIndex(t=>t[0]===k);let j=-1;if(e.key==='ArrowRight')j=(i+1)%4;if(e.key==='ArrowLeft')j=(i+3)%4;if(e.key==='Home')j=0;if(e.key==='End')j=3;if(j>=0){e.preventDefault();goTab(TABS[j][0],true)}}}
window.addEventListener('hashchange',()=>{const t=TABS.find(t=>'#'+t[1]===location.hash);if(t&&t[0]!==tab)goTab(t[0])});
window.addEventListener('pywebviewready',()=>render());

/* ---------- boot ---------- */
function boot(data){data=data||{};
 songs=data.songs||LS.get('fw-songs',null)||SAMPLES.map(s=>({...s}));scfg=LS.get('fw-scfg',null)||{key:9,sc:'minpent',pat:'nps',pos:0,str:2,seq:'updown',spb:4,legato:false};prog=data.prog||LS.get('fw-prog',{});mins=data.mins||LS.get('fw-mins',{});
 select(drillItem(DRILLS[0]));drawFB();showToday();const t0=TABS.find(t=>'#'+t[1]===location.hash);if(t0&&t0[0]!=='drills')goTab(t0[0])}
window.claude?.hot?.snapshot?.(()=>({songs,prog,mins}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>
</body>
</html>
