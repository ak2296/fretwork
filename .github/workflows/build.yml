name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pywebview pyinstaller

      - name: Build Fretwork.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Fretwork --icon fretwork.ico --add-data "fretwork.html;." --add-data "fretwork.ico;." fretwork_app.py

      - name: Build installer (FretworkSetup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" fretwork.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Fretwork
          path: |
            dist/Fretwork.exe
            dist/FretworkSetup.exe

      - name: Publish as the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/FretworkSetup.exe dist/Fretwork.exe \
            --title "Fretwork (latest build)" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download FretworkSetup.exe to install Fretwork with a Start menu entry. Fretwork.exe is the portable version that runs without installing."
